name: Jenkins Build

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch atau tag yang di-build ulang di Jenkins (mis. v1.0.0). Tag akan di-deploy ulang.'
        required: true
        default: develop

concurrency:
  group: jenkins-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  jenkins:
    name: Jenkins » ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Build di Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JOB: cassier-q-api
          REF: ${{ inputs.ref || github.ref_name }}
          # Push pertama: ikuti build yang dipicu webhook. Re-run / manual: build baru.
          MODE: ${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && 'trigger' || 'follow' }}
        # Commit SHA (not the annotated tag object) — that's what Jenkins records
        run: SHA=$(git rev-parse HEAD) .github/scripts/jenkins-build.sh

      - name: Upload log Jenkins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: jenkins.log
          if-no-files-found: ignore
