services:
  api:
    image: localhost:5000/cassier-q-api:${IMAGE_TAG:-latest}
    container_name: cassier-q-api-${COLOR:?COLOR is required, deploy via deploy.sh}
    restart: always
    env_file: .env
    mem_limit: 1g
    ports:
      # 8080 on the host is taken by Jenkins
      - "127.0.0.1:${HOST_PORT:?HOST_PORT is required}:8080"
    volumes:
      - uploads:/app/uploads
    networks: [dbnet]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    # Let Spring's graceful shutdown finish in-flight requests
    stop_grace_period: 40s

volumes:
  # Shared by both colors so uploaded product photos survive every deploy
  uploads:
    name: cassier-q-api_uploads
    external: true

networks:
  dbnet:
    external: true
