spring:
  application:
    name: cassier-q-api

  datasource:
    # Points at the SQL Server instance the sibling Go backend already owns
    # (schema: stores/users/roles/products/sales_transactions/...) — NOT a
    # database we create or manage. trustServerCertificate=true because
    # Azure SQL Edge's dev container serves a self-signed cert.
    url: ${DATABASE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=cassierQ;encrypt=true;trustServerCertificate=true}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:PasswordAnda123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only ever validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # The existing schema stores timestamps as plain `datetime2` (no
        # offset), always in UTC (default sysutcdatetime()). Without this,
        # Hibernate maps java.time.Instant to `datetimeoffset` by default and
        # schema validation fails against every created_at/updated_at column.
        timezone:
          default_storage: NORMALIZE_UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The database already has a full schema we didn't create (see above) —
    # baseline it as "version 1" instead of trying to run a V1 migration
    # against it. Only V2+ (additive, ours) actually execute.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "pre-existing schema (owned by the Go backend)"

server:
  port: ${PORT:8080}

app:
  jwt:
    # HS256 needs >= 256 bits (32 bytes); generate your own with
    # `openssl rand -base64 64` before deploying anywhere real.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,exp://localhost:19000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.cassierq.api: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
