spring:
  application:
    name: cassier-q-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cassierq}
    username: ${DATABASE_USERNAME:cassierq}
    password: ${DATABASE_PASSWORD:cassierq}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only ever validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start_and_stop

server:
  port: ${PORT:8080}

app:
  jwt:
    # HS256 needs >= 256 bits (32 bytes); generate your own with
    # `openssl rand -base64 64` before deploying anywhere real.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,exp://localhost:19000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.cassierq.api: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
